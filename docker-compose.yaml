services:
  db:
    image: postgres:17
    environment:
      POSTGRES_DB: HammerSystems
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    volumes:
      - pgdata:/var/lib/postgresql/data
    ports:
      - "5432:5432"
  web:
    build:
      context: ./HammerSystems
    command: sh -c "sleep 5 && python manage.py runserver 0.0.0.0:8000"
    volumes:
      - ./HammerSystems:/app
    ports:
      - "8000:8000"
    depends_on:
      - db
    environment:
      - DB_NAME=HammerSystems
      - DB_USER=postgres
      - DB_PASSWORD=postgres
      - DB_HOST=db
      - DB_PORT=5432
volumes:
   pgdata:


